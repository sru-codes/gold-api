<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="gold-api logo">
  <title>gold-api</title>
  <defs>
    <linearGradient id="lg-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1220"/>
      <stop offset="1" stop-color="#161f33"/>
    </linearGradient>
    <linearGradient id="lg-gold" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#fff3c9"/>
      <stop offset="0.30" stop-color="#f9d34d"/>
      <stop offset="0.62" stop-color="#e6ab1a"/>
      <stop offset="1" stop-color="#b57e07"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#lg-bg)"/>
  <rect x="8" y="8" width="240" height="240" rx="52" fill="none" stroke="#f9d34d" stroke-opacity="0.22" stroke-width="2"/>

  <g transform="translate(128,128)">
    <circle r="62" fill="url(#lg-gold)"/>
    <circle r="62" fill="none" stroke="#000000" stroke-opacity="0.18" stroke-width="3"/>
    <circle r="47" fill="none" stroke="#7a5200" stroke-opacity="0.45" stroke-width="4"/>
    <text y="24" text-anchor="middle"
          font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
          font-size="62" font-weight="800" fill="#5c3d00" letter-spacing="-1">Au</text>
  </g>
</svg>
