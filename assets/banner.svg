<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-label="gold-api — self-hosted gold and USD/INR market data API">
  <title>gold-api</title>
  <desc>Self-hosted, Railway-ready JSON API for gold spot and USD/INR reference FX.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0d14"/>
      <stop offset="0.55" stop-color="#0d1220"/>
      <stop offset="1" stop-color="#131a2b"/>
    </linearGradient>

    <linearGradient id="gold" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#fff3c9"/>
      <stop offset="0.30" stop-color="#f9d34d"/>
      <stop offset="0.62" stop-color="#e6ab1a"/>
      <stop offset="1" stop-color="#b57e07"/>
    </linearGradient>

    <linearGradient id="goldline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f9d34d" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#f9d34d" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#f9d34d" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="glow" cx="0.5" cy="0.28" r="0.75">
      <stop offset="0" stop-color="#f9d34d" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#f9d34d" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>

    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="1280" height="420" fill="url(#bg)"/>
  <rect width="1280" height="420" fill="url(#grid)"/>
  <rect width="1280" height="420" fill="url(#glow)"/>

  <!-- faint candlestick field, right -->
  <g opacity="0.22" fill="url(#gold)">
    <g stroke="#f9d34d" stroke-width="2" stroke-opacity="0.7">
      <line x1="1000" y1="286" x2="1000" y2="356"/>
      <line x1="1028" y1="272" x2="1028" y2="344"/>
      <line x1="1056" y1="298" x2="1056" y2="372"/>
      <line x1="1084" y1="262" x2="1084" y2="330"/>
      <line x1="1112" y1="248" x2="1112" y2="322"/>
      <line x1="1140" y1="276" x2="1140" y2="346"/>
      <line x1="1168" y1="236" x2="1168" y2="312"/>
      <line x1="1196" y1="224" x2="1196" y2="300"/>
      <line x1="1224" y1="248" x2="1224" y2="322"/>
    </g>
    <rect x="994" y="300" width="12" height="44" rx="2"/>
    <rect x="1022" y="286" width="12" height="42" rx="2"/>
    <rect x="1050" y="312" width="12" height="44" rx="2"/>
    <rect x="1078" y="278" width="12" height="36" rx="2"/>
    <rect x="1106" y="264" width="12" height="42" rx="2"/>
    <rect x="1134" y="292" width="12" height="40" rx="2"/>
    <rect x="1162" y="252" width="12" height="44" rx="2"/>
    <rect x="1190" y="240" width="12" height="40" rx="2"/>
    <rect x="1218" y="264" width="12" height="40" rx="2"/>
  </g>

  <!-- coin mark -->
  <g transform="translate(640,108)">
    <circle cx="0" cy="6" r="52" fill="#f9d34d" opacity="0.18" filter="url(#soft)"/>
    <circle r="52" fill="url(#gold)"/>
    <circle r="52" fill="none" stroke="#000000" stroke-opacity="0.18" stroke-width="2"/>
    <circle r="39" fill="none" stroke="#7a5200" stroke-opacity="0.45" stroke-width="3"/>
    <text y="20" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="800" fill="#5c3d00" letter-spacing="-1">Au</text>
  </g>

  <!-- wordmark -->
  <text x="640" y="252" text-anchor="middle"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="94" font-weight="800" letter-spacing="-3" fill="url(#gold)">gold-api</text>

  <!-- tagline -->
  <text x="640" y="298" text-anchor="middle"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="25" font-weight="500" fill="#c9d2e3" letter-spacing="0.2">Self-hosted gold &amp; USD/INR market data, refreshed every 60 seconds</text>

  <!-- endpoint strip -->
  <text x="640" y="348" text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace"
        font-size="19" fill="#8ea0bd" letter-spacing="1.5">XAU/USD   ·   USD/INR   ·   DAILY BARS   ·   JSON   ·   RAILWAY-READY</text>

  <rect x="0" y="416" width="1280" height="4" fill="url(#goldline)"/>
</svg>
