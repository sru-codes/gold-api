name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint & test (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        run: pytest -q

      - name: Import the app
        run: python -c "import app.main; print('app import OK')"

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t gold-api:ci .

      - name: Smoke test the image
        run: |
          docker run -d --name gold-api-ci -p 8000:8000 \
            -e DATA_DIR=/tmp/data -e CACHE_DIR=/tmp/data/cache \
            gold-api:ci
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:8000/health >/dev/null 2>&1; then
              echo "health endpoint responded"; break
            fi
            sleep 1
          done
          curl -fsS http://localhost:8000/ | head -c 400 || (docker logs gold-api-ci; exit 1)
          docker rm -f gold-api-ci
